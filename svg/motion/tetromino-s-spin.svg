<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="S block, spin"><style>.ahtk{fill:var(--c,#8b5cf6)}.aht0{animation:aht_0 2.4s linear var(--delay,0s) var(--loops,infinite);transform-origin:16px 16px}.aht1{animation:aht_1 2.4s linear var(--delay,0s) var(--loops,infinite);transform-origin:19.5px 12.1px}@keyframes aht_0{0%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.6,0,.4,1)}40%,100%{transform:rotate(360deg);animation-timing-function:cubic-bezier(.6,0,.4,1)}}@keyframes aht_1{0%,70%,76%,100%{transform:scale(1,1);animation-timing-function:ease}73%{transform:scale(1,.1);animation-timing-function:ease}}#still:target~[class^=aht],#still:target~* [class^=aht],.still [class^=aht]{animation:none}@media (max-width:20px){.ahtf{display:none}}@media (prefers-reduced-motion:reduce){[class^=aht]{animation:none!important}}</style><defs><g id="ahtc"><rect width="6.4" height="6.4" rx="1.3"/><rect x=".9" y=".7" width="4.6" height="1.1" rx=".55" fill="#fff" opacity=".45"/><rect x=".35" y=".35" width="5.7" height="5.7" rx="1" fill="none" stroke="#000" stroke-opacity=".3" stroke-width=".7"/></g></defs><g id="still"/><g class="aht0 ahtk"><use href="#ahtc" x="12.8" y="9.3"/><use href="#ahtc" x="19.8" y="9.3"/><use href="#ahtc" x="5.8" y="16.3"/><use href="#ahtc" x="12.8" y="16.3"/><g class="ahtf"><path d="M18.2 14.5C19.07 15.3 19.93 15.3 20.8 14.5" fill="none" stroke="#1e1b4b" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/><g class="aht1"><circle cx="16" cy="12.1" r="1.1" fill="#1e1b4b"/><circle cx="23" cy="12.1" r="1.1" fill="#1e1b4b"/></g></g></g></svg>