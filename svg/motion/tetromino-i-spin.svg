<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="I block, spin"><style>.ahpk{fill:var(--c,#f43f5e)}.ahp0{animation:ahp_0 2.4s linear var(--delay,0s) var(--loops,infinite);transform-origin:16px 16px}.ahp1{animation:ahp_1 2.4s linear var(--delay,0s) var(--loops,infinite);transform-origin:16px 15.6px}@keyframes ahp_0{0%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.6,0,.4,1)}40%,100%{transform:rotate(360deg);animation-timing-function:cubic-bezier(.6,0,.4,1)}}@keyframes ahp_1{0%,70%,76%,100%{transform:scale(1,1);animation-timing-function:ease}73%{transform:scale(1,.1);animation-timing-function:ease}}#still:target~[class^=ahp],#still:target~* [class^=ahp],.still [class^=ahp]{animation:none}@media (max-width:20px){.ahpf{display:none}}@media (prefers-reduced-motion:reduce){[class^=ahp]{animation:none!important}}</style><defs><g id="ahpc"><rect width="6.4" height="6.4" rx="1.3"/><rect x=".9" y=".7" width="4.6" height="1.1" rx=".55" fill="#fff" opacity=".45"/><rect x=".35" y=".35" width="5.7" height="5.7" rx="1" fill="none" stroke="#000" stroke-opacity=".3" stroke-width=".7"/></g></defs><g id="still"/><g class="ahp0 ahpk"><use href="#ahpc" x="2.3" y="12.8"/><use href="#ahpc" x="9.3" y="12.8"/><use href="#ahpc" x="16.3" y="12.8"/><use href="#ahpc" x="23.3" y="12.8"/><g class="ahpf"><path d="M14.7 18C15.57 18.8 16.43 18.8 17.3 18" fill="none" stroke="#1e1b4b" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/><g class="ahp1"><circle cx="12.5" cy="15.6" r="1.1" fill="#1e1b4b"/><circle cx="19.5" cy="15.6" r="1.1" fill="#1e1b4b"/></g></g></g></svg>